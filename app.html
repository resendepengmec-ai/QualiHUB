<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QShub</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="appbar">
    <button class="btn ghost sm" id="btnHome" style="display:none">‹ Início</button>
    <div class="brand" id="brandHome" title="Ir para o início"><span class="brandname">QShub</span><span class="poweredby">powered by</span><img src="logo.png" alt="Qualiservice" class="brandlogo"></div>
    <div class="contrato-select">
      <label for="selContrato">Contrato</label>
      <select id="selContrato"></select>
    </div>
    <div class="spacer"></div>
    <div class="who" id="who"></div>
    <button class="btn sm ghost" id="btnSair">Sair</button>
  </header>

  <main class="wrap" id="view"></main>

  <div class="modal-bg" id="modalBg"><div class="modal" id="modal"></div></div>
  <div class="toast" id="toast"></div>

  <script src="config.js"></script>
  <script src="api-client.js"></script>
  <script src="ui.js"></script>
  <script src="dashboard.js"></script>
  <script src="ocorrencias.js"></script>
  <script src="pdf.js"></script>
  <script src="cadastro.js"></script>
  <script src="pac.js"></script>
  <script src="empresa.js"></script>
  <script src="clientes.js"></script>
  <script src="app-boot.js"></script>
</body>
</html>

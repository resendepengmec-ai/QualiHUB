<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QualiHUB</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="appbar">
    <div class="brand"><span class="mark">QH</span> QualiHUB</div>
    <div class="contrato-select">
      <label for="selContrato">Contrato</label>
      <select id="selContrato"></select>
    </div>
    <div class="spacer"></div>
    <div class="who" id="who"></div>
    <button class="btn sm ghost" id="btnSair">Sair</button>
  </header>

  <nav class="nav" id="nav"></nav>
  <main class="wrap" id="view"></main>

  <div class="modal-bg" id="modalBg"><div class="modal" id="modal"></div></div>
  <div class="toast" id="toast"></div>

  <script src="config.js"></script>
  <script src="api-client.js"></script>
  <script>
  // ── infra de UI ───────────────────────────────────────────────
  const $ = (s, r = document) => r.querySelector(s);
  const view = $('#view');
  let contratos = [];   // lista completa (do backend, já filtrada por acesso)
  let membrosCache = {};

  function toast(msg, err = false) {
    const t = $('#toast'); t.textContent = msg; t.className = 'toast show' + (err ? ' err' : '');
    setTimeout(() => t.className = 'toast', 2600);
  }
  function openModal(html) { $('#modal').innerHTML = html; $('#modalBg').classList.add('show'); }
  function closeModal() { $('#modalBg').classList.remove('show'); }
  $('#modalBg').addEventListener('click', e => { if (e.target === $('#modalBg')) closeModal(); });
  const fmtDate = d => d ? new Date(d + (d.length <= 10 ? 'T00:00:00' : '')).toLocaleDateString('pt-BR') : '—';

  function isAdministradorAnywhere() {
    if (isMaster()) return true;
    if (getCurrentUser().role === 'admin') return true; // administrador de cliente
    return getAcessos().some(a => a.papel === 'administrador');
  }

  // ── boot ──────────────────────────────────────────────────────
  (async () => {
    if (!requireSession()) return;
    try { await refreshMe(); }
    catch (e) { return logout(); }

    const u = getCurrentUser();
    $('#who').innerHTML =
      (u.picture ? `<img src="${esc(u.picture)}" alt="">` : '') +
      `<span>${esc(u.name || u.email)}${isMaster() ? ' · <strong>Master</strong>' : ''}</span>`;
    $('#btnSair').onclick = () => logout();

    await carregarContratos();
    montarNav();
    irPara(location.hash.replace('#', '') || 'dashboard');
  })();

  async function carregarContratos() {
    contratos = await DB.getContratos();
    const sel = $('#selContrato');
    if (!contratos.length) {
      sel.innerHTML = '<option value="">— sem contratos —</option>';
    } else {
      const atual = getContratoAtual() && contratos.some(c => c.id === getContratoAtual())
        ? getContratoAtual() : contratos[0].id;
      setContratoAtual(atual);
      sel.innerHTML = contratos.map(c =>
        `<option value="${c.id}">${esc(c.numero)}${c.objeto ? ' — ' + esc(c.objeto) : ''}</option>`).join('');
      sel.value = atual;
    }
    sel.onchange = () => { setContratoAtual(sel.value); irPara(active); };
  }

  // ── navegação ─────────────────────────────────────────────────
  const TABS = [
    { id: 'dashboard',   label: 'Dashboard' },
    { id: 'ocorrencias', label: 'Ocorrências' },
    { id: 'pac',         label: 'P.A.C.', when: () => !!getContratoAtual() },
    { id: 'cadastro',    label: 'Cadastro', when: isAdministradorAnywhere },
    { id: 'empresa',     label: 'Minha Empresa', when: () => isMaster() || getCurrentUser().role === 'admin' },
    { id: 'clientes',    label: 'Clientes', when: isMaster },
  ];
  let active = 'dashboard';
  function montarNav() {
    $('#nav').innerHTML = TABS.filter(t => !t.when || t.when())
      .map(t => `<button data-tab="${t.id}">${t.label}</button>`).join('');
    $('#nav').querySelectorAll('button').forEach(b => b.onclick = () => irPara(b.dataset.tab));
  }
  function irPara(tab) {
    active = tab; location.hash = tab;
    $('#nav').querySelectorAll('button').forEach(b => b.setAttribute('aria-current', String(b.dataset.tab === tab)));
    ({ dashboard: renderDashboard, ocorrencias: renderOcorrencias, pac: renderPac, cadastro: renderCadastro, empresa: renderEmpresa, clientes: renderClientes }[tab] || renderDashboard)();
  }

  async function getMembros(cid) {
    if (membrosCache[cid]) return membrosCache[cid];
    try { membrosCache[cid] = await DB.getMembros(cid); } catch (e) { membrosCache[cid] = []; }
    return membrosCache[cid];
  }

  // ══════════════════════════════════════════════════════════════
  // DASHBOARD
  // ══════════════════════════════════════════════════════════════
  async function renderDashboard() {
    const cid = getContratoAtual();
    view.innerHTML = `<div class="view-head"><div>
      <div class="eyebrow">Desempenho</div><h1>Prazo de atendimento das não conformidades</h1></div></div>
      <div id="dashBody" class="muted">Carregando…</div>`;
    try {
      const s = await DB.getStats(cid);
      const body = $('#dashBody');
      body.innerHTML = `
        <div class="grid cols-3">
          <div class="kpi"><div class="n danger">${s.abertasVencidas}</div><div class="lbl">Em aberto e vencidas</div></div>
          <div class="kpi"><div class="n">${s.abertas}</div><div class="lbl">Em aberto</div></div>
          <div class="kpi"><div class="n">${s.total}</div><div class="lbl">Total no escopo</div></div>
          <div class="kpi"><div class="n ok">${s.pctNoPrazo === null ? '—' : s.pctNoPrazo + '%'}</div><div class="lbl">Atendidas no prazo</div></div>
          <div class="kpi"><div class="n warn">${s.atendidasComAtraso}</div><div class="lbl">Concluídas com atraso</div></div>
          <div class="kpi"><div class="n">${s.tempoMedioAtendimentoHoras === null ? '—' : s.tempoMedioAtendimentoHoras + 'h'}</div><div class="lbl">Tempo médio de atendimento</div></div>
        </div>
        <div class="view-head" style="margin-top:26px"><div><div class="eyebrow">${cid ? 'Contrato selecionado' : 'Selecione um contrato'}</div>
          <h2>Não conformidades em aberto</h2></div></div>
        <div id="abertas"></div>`;
      if (cid) {
        const ocs = (await DB.getOcorrenciasContrato(cid)).filter(o => o.estado !== 'concluida');
        $('#abertas').innerHTML = ocs.length
          ? ocs.sort(ordenarPorUrgencia).map(cardOcorrencia).join('')
          : `<div class="empty"><strong>Nenhuma não conformidade em aberto</strong>Bom sinal — este contrato está em dia.</div>`;
      } else {
        $('#abertas').innerHTML = `<div class="empty"><strong>Escolha um contrato acima</strong>Para ver as não conformidades em aberto por contrato.</div>`;
      }
    } catch (e) { $('#dashBody').innerHTML = `<div class="empty"><strong>Não foi possível carregar</strong>${esc(e.message)}</div>`; }
  }
  function ordenarPorUrgencia(a, b) {
    const rank = { vencida: 0, vencendo: 1, aberta: 2, atraso: 3, ok: 4 };
    return rank[statusOcorrencia(a).key] - rank[statusOcorrencia(b).key];
  }

  // ══════════════════════════════════════════════════════════════
  // OCORRÊNCIAS
  // ══════════════════════════════════════════════════════════════
  let ocSub = 'atribuidas';
  function renderOcorrencias() {
    view.innerHTML = `<div class="view-head">
      <div><div class="eyebrow">Não conformidades</div><h1>Ocorrências</h1></div>
      <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
        <div class="subtabs" id="ocSubs">
          <button data-s="atribuidas">Atribuídas a mim</button>
          <button data-s="criar">Criar ocorrência</button>
          <button data-s="contrato">Do contrato</button>
        </div>
        <button class="btn sm" id="btnPdf">Gerar PDF</button>
      </div></div>
      <div id="ocBody"></div>`;
    $('#ocSubs').querySelectorAll('button').forEach(b => {
      b.setAttribute('aria-current', String(b.dataset.s === ocSub));
      b.onclick = () => { ocSub = b.dataset.s; renderOcorrencias(); };
    });
    $('#btnPdf').onclick = abrirRelatorioModal;
    ({ atribuidas: ocAtribuidas, criar: ocCriar, contrato: ocDoContrato }[ocSub])();
  }

  function cardOcorrencia(o, opts = {}) {
    const st = statusOcorrencia(o);
    const g  = (o.gravidade || 'baixa').toLowerCase();
    const podeResolver = opts.resolver && o.estado !== 'concluida' &&
      (o.atribuidoA || '').toLowerCase() === (getCurrentUser().email || '').toLowerCase();
    return `<div class="card spine s-${st.key}">
      <div style="display:flex;justify-content:space-between;gap:12px;align-items:flex-start">
        <div>
          <span class="chip ${st.key}">${st.label}</span>
          <span class="grav ${g}" style="margin-left:8px">${esc(o.gravidade || 'baixa')}</span>
        </div>
        <span class="muted" style="font-size:.78rem">${o.criadoEm ? new Date(o.criadoEm).toLocaleDateString('pt-BR') : ''}</span>
      </div>
      <p style="margin:8px 0 6px;font-weight:600">${esc(o.descricao || '')}</p>
      <div class="muted" style="font-size:.8rem">
        Prazo: <strong>${fmtDate(o.prazoCorrecao)}</strong>
        · Criada por ${esc(o.criadoPorNome || o.criadoPor || '?')}
        · Atribuída a ${esc(o.atribuidoA || '—')}
      </div>
      ${Array.isArray(o.fotos) && o.fotos.length ? `<div class="fotos">${o.fotos.map(f => `<img src="${esc(f.dataUrl)}" alt="">`).join('')}</div>` : ''}
      ${o.execucao ? `<div class="card" style="margin-top:10px;box-shadow:none;background:var(--surface-2)">
        <div class="eyebrow">Execução da correção</div>
        <div style="font-size:.86rem;margin-top:4px">${esc(o.execucao.descricaoExecucao)}</div>
        <div class="muted" style="font-size:.78rem;margin-top:4px">Executada em ${fmtDate(o.execucao.dataExecucao)} por ${esc(o.execucao.porNome || o.execucao.por)}</div>
      </div>` : ''}
      ${podeResolver ? `<div style="margin-top:12px"><button class="btn primary sm" data-resolver="${o.id}">Registrar correção</button></div>` : ''}
    </div>`;
  }
  function ligarResolver(container) {
    container.querySelectorAll('[data-resolver]').forEach(b => b.onclick = () => abrirResolver(b.dataset.resolver));
  }

  async function ocAtribuidas() {
    const body = $('#ocBody'); body.innerHTML = '<p class="muted">Carregando…</p>';
    try {
      const ocs = await DB.getAtribuidas();
      body.innerHTML = ocs.length
        ? ocs.sort(ordenarPorUrgencia).map(o => cardOcorrencia(o, { resolver: true })).join('')
        : `<div class="empty"><strong>Nada atribuído a você</strong>Quando alguém atribuir uma correção a você, ela aparece aqui.</div>`;
      ligarResolver(body);
    } catch (e) { body.innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
  }

  async function ocDoContrato() {
    const cid = getContratoAtual(); const body = $('#ocBody');
    if (!cid) return body.innerHTML = `<div class="empty"><strong>Escolha um contrato</strong>Selecione um contrato acima para ver suas ocorrências.</div>`;
    body.innerHTML = '<p class="muted">Carregando…</p>';
    try {
      const ocs = await DB.getOcorrenciasContrato(cid);
      body.innerHTML = ocs.length
        ? ocs.sort(ordenarPorUrgencia).map(o => cardOcorrencia(o, { resolver: true })).join('')
        : `<div class="empty"><strong>Sem ocorrências neste contrato</strong>Registre a primeira na aba “Criar ocorrência”.</div>`;
      ligarResolver(body);
    } catch (e) { body.innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
  }

  async function ocCriar() {
    const cid = getContratoAtual(); const body = $('#ocBody');
    if (!cid) return body.innerHTML = `<div class="empty"><strong>Escolha um contrato</strong>Selecione o contrato onde observou a ocorrência.</div>`;
    const membros = (await getMembros(cid)).filter(m => m.email.toLowerCase() !== getCurrentUser().email.toLowerCase());
    body.innerHTML = `<div class="card">
      <div class="row">
        <label class="field"><span>Gravidade</span>
          <select id="fGrav">${GRAVIDADES.map(g => `<option value="${g}">${g[0].toUpperCase() + g.slice(1)}</option>`).join('')}</select></label>
        <label class="field"><span>Prazo para correção</span><input type="date" id="fPrazo"></label>
      </div>
      <label class="field"><span>Descrição da não conformidade</span>
        <textarea id="fDesc" placeholder="O que foi observado, onde, e por quê é uma não conformidade"></textarea></label>
      <label class="field"><span>Atribuir a (responsável pela correção)</span>
        <select id="fAtrib">
          <option value="">— escolha um membro do contrato —</option>
          ${membros.map(m => `<option value="${esc(m.email)}">${esc(m.name || m.email)} · ${esc((PAPEIS[m.papel]||{}).label || m.papel)}</option>`).join('')}
        </select></label>
      <label class="field"><span>Fotos (até 3)</span><input type="file" id="fFotos" accept="image/*" capture="environment" multiple></label>
      <div class="fotos" id="fPrev"></div>
      <div style="margin-top:8px"><button class="btn primary" id="fSalvar">Registrar ocorrência</button></div>
    </div>`;
    pedirLocalizacao(); // pede permissão/posição cedo
    let fotos = [];
    $('#fFotos').onchange = async (e) => {
      toast('Processando foto…');
      for (const file of [...e.target.files]) { if (fotos.length >= 3) break; fotos.push(await capturarFoto(file)); }
      $('#fPrev').innerHTML = fotos.map(f => `<img src="${f.dataUrl}" alt="">`).join('');
      if (fotos.some(f => f.lat == null)) toast('Foto salva sem localização — verifique a permissão de local do navegador.', true);
      e.target.value = '';
    };
    $('#fSalvar').onclick = async () => {
      const desc = $('#fDesc').value.trim();
      if (!desc) return toast('Descreva a não conformidade.', true);
      $('#fSalvar').disabled = true;
      try {
        await DB.criarOcorrencia({
          contratoId: cid, gravidade: $('#fGrav').value,
          prazoCorrecao: $('#fPrazo').value || null, descricao: desc,
          atribuidoA: $('#fAtrib').value || null, fotos,
        });
        toast('Ocorrência registrada.');
        ocSub = 'contrato'; renderOcorrencias();
      } catch (e) { toast(e.message, true); $('#fSalvar').disabled = false; }
    };
  }

  function abrirResolver(id) {
    openModal(`<div class="eyebrow">Ver atribuídas a mim</div><h2>Registrar correção</h2>
      <p class="muted" style="font-size:.85rem;margin:.3rem 0 1rem">Você é o responsável por esta correção. Registre o que foi feito.</p>
      <label class="field"><span>Data de execução</span><input type="date" id="rData" value="${new Date().toISOString().slice(0,10)}"></label>
      <label class="field"><span>Descrição da execução</span><textarea id="rDesc" placeholder="O que foi feito para corrigir"></textarea></label>
      <label class="field"><span>Fotos (até 3)</span><input type="file" id="rFotos" accept="image/*" capture="environment" multiple></label>
      <div class="fotos" id="rPrev"></div>
      <div class="actions"><button class="btn" id="rCancel">Cancelar</button><button class="btn primary" id="rOk">Concluir correção</button></div>`);
    let fotos = [];
    pedirLocalizacao();
    $('#rFotos').onchange = async (e) => {
      toast('Processando foto…');
      for (const file of [...e.target.files]) { if (fotos.length >= 3) break; fotos.push(await capturarFoto(file)); }
      $('#rPrev').innerHTML = fotos.map(f => `<img src="${f.dataUrl}" alt="">`).join('');
      if (fotos.some(f => f.lat == null)) toast('Foto salva sem localização — verifique a permissão de local do navegador.', true);
      e.target.value = '';
    };
    $('#rCancel').onclick = closeModal;
    $('#rOk').onclick = async () => {
      const d = $('#rDesc').value.trim();
      if (!d) return toast('Descreva o que foi feito.', true);
      $('#rOk').disabled = true;
      try {
        await DB.resolverOcorrencia(id, { dataExecucao: $('#rData').value, descricaoExecucao: d, fotos });
        closeModal(); toast('Correção registrada.'); renderOcorrencias();
      } catch (e) { toast(e.message, true); $('#rOk').disabled = false; }
    };
  }

  // ── Relatório PDF (por período / contrato / estabelecimento) ────
  function abrirRelatorioModal() {
    const estMap = {};
    contratos.forEach(c => { if (c.estabelecimentoId) estMap[c.estabelecimentoId] = c.estabelecimentoNome || c.estabelecimentoId; });
    const estOpts = Object.entries(estMap).map(([id, nome]) => `<option value="${id}">${esc(nome)}</option>`).join('');
    openModal(`<div class="eyebrow">Ocorrências</div><h2>Gerar PDF</h2>
      <label class="field"><span>Contrato</span><select id="rContrato">
        <option value="">Todos os meus contratos</option>
        ${contratos.map(c => `<option value="${c.id}">${esc(c.numero)}${c.objeto ? ' — ' + esc(c.objeto) : ''}</option>`).join('')}</select></label>
      <label class="field"><span>Estabelecimento</span><select id="rEst"><option value="">Todos</option>${estOpts}</select></label>
      <div class="row"><label class="field"><span>De</span><input type="date" id="rFrom"></label>
        <label class="field"><span>Até</span><input type="date" id="rTo"></label></div>
      <p class="muted" style="font-size:.78rem">Se escolher um contrato, o filtro de estabelecimento é ignorado. Sem datas, entram todas as ocorrências.</p>
      <div class="actions"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn primary" id="rGerar">Gerar</button></div>`);
    $('#rGerar').onclick = async () => {
      const p = new URLSearchParams();
      if ($('#rContrato').value) p.set('contrato', $('#rContrato').value);
      else if ($('#rEst').value) p.set('estabelecimento', $('#rEst').value);
      if ($('#rFrom').value) p.set('from', $('#rFrom').value);
      if ($('#rTo').value) p.set('to', $('#rTo').value);
      $('#rGerar').disabled = true;
      try { const dados = await DB.getRelatorioOcorrencias(p.toString()); closeModal(); gerarRelatorioPDF(dados); }
      catch (e) { toast(e.message, true); $('#rGerar').disabled = false; }
    };
  }

  // Carrega o pdfmake sob demanda (CDN) para gerar PDF A4 formatado.
  let _pdfLoad;
  function ensurePdfMake() {
    if (window.pdfMake && window.pdfMake.vfs) return Promise.resolve();
    if (_pdfLoad) return _pdfLoad;
    const load = (src) => new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => rej(new Error('Falha ao carregar ' + src)); document.head.appendChild(s); });
    _pdfLoad = load('https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.10/pdfmake.min.js')
      .then(() => load('https://cdnjs.cloudflare.com/ajax/libs/pdfmake/0.2.10/vfs_fonts.js'));
    return _pdfLoad;
  }

  function gerarRelatorioPDF(d) {
    toast('Gerando PDF...');
    ensurePdfMake().then(() => {
      const cab = d.cabecalho || {};
      const temBranding = !!(cab.logoDataUrl || cab.razaoSocial || cab.nomeFantasia);
      const linhaEscopo = [d.escopo.contratoNumero ? 'Contrato ' + d.escopo.contratoNumero : 'Todos os contratos'];
      if (d.escopo.estabelecimentoNome) linhaEscopo.push('Estabelecimento: ' + d.escopo.estabelecimentoNome);
      const periodo = (d.escopo.from || d.escopo.to)
        ? (d.escopo.from ? fmtDate(d.escopo.from) : 'inicio') + ' a ' + (d.escopo.to ? fmtDate(d.escopo.to) : 'hoje') : 'Todo o periodo';
      const geradoEm = new Date(d.geradoEm).toLocaleString('pt-BR');

      const header = () => {
        const emp = [{ text: cab.razaoSocial || cab.nomeFantasia || 'QualiHUB', bold: true, fontSize: 12, color: '#0a5f4e' }];
        if (cab.nomeFantasia && cab.razaoSocial) emp.push({ text: cab.nomeFantasia, fontSize: 8, color: '#5e6b65' });
        if (cab.cnpj) emp.push({ text: 'CNPJ: ' + cab.cnpj, fontSize: 8, color: '#5e6b65' });
        if (cab.endereco) emp.push({ text: cab.endereco, fontSize: 8, color: '#5e6b65' });
        if (cab.contato) emp.push({ text: cab.contato, fontSize: 8, color: '#5e6b65' });
        const cols = [];
        if (cab.logoDataUrl) cols.push({ image: cab.logoDataUrl, fit: [110, 46], margin: [0, 0, 12, 0] });
        cols.push({ stack: emp, width: '*' });
        return { margin: [40, 22, 40, 0], stack: [
          { columns: cols, columnGap: 10 },
          { canvas: [{ type: 'line', x1: 0, y1: 6, x2: 515, y2: 6, lineWidth: 0.7, lineColor: '#0e7c66' }] },
        ] };
      };
      const footer = (currentPage, pageCount) => ({ margin: [40, 8, 40, 0], columns: [
        { text: 'Gerado por ' + (d.geradoPor || d.geradoPorEmail) + ' em ' + geradoEm, fontSize: 7, color: '#8a938e' },
        { text: 'Pagina ' + currentPage + ' de ' + pageCount, alignment: 'right', fontSize: 7, color: '#8a938e' },
      ] });

      function bloco(o, n) {
        const st = statusOcorrencia(o);
        const linha = [];
        if (o.contratoNumero) linha.push('Contrato ' + o.contratoNumero);
        if (o.estabelecimentoNome) linha.push(o.estabelecimentoNome);
        linha.push('Gravidade: ' + (o.gravidade || '-'));
        linha.push(st.label);
        linha.push('Prazo: ' + (o.prazoCorrecao ? fmtDate(o.prazoCorrecao) : '-'));
        linha.push('Criada por ' + (o.criadoPorNome || o.criadoPor || '-') + (o.criadoEm ? ' em ' + new Date(o.criadoEm).toLocaleDateString('pt-BR') : ''));
        linha.push('Atribuida a ' + (o.atribuidoA || '-'));
        const c = [
          { text: [{ text: n + '. ', bold: true, color: '#0a5f4e' }, { text: o.descricao || '', bold: true }], fontSize: 10.5 },
          { text: linha.join('  -  '), fontSize: 8, color: '#5e6b65', margin: [0, 2, 0, 0] },
        ];
        const fotos = (o.fotos || []).concat(o.fotosExecucao || []).filter(f => f && f.dataUrl);
        for (let k = 0; k < fotos.length; k += 3) {
          c.push({ columns: fotos.slice(k, k + 3).map(f => ({ image: f.dataUrl, fit: [150, 150] })), columnGap: 8, margin: [0, 6, 0, 0] });
        }
        if (o.execucao) c.push({ text: [{ text: 'Correcao: ', bold: true }, { text: o.execucao.descricaoExecucao + ' - executada em ' + fmtDate(o.execucao.dataExecucao) + ' por ' + (o.execucao.porNome || o.execucao.por) }], fontSize: 8.5, margin: [0, 6, 0, 0] });
        return { stack: c, unbreakable: true, margin: [0, 0, 0, 12] };
      }

      const body = [
        { text: 'Relatorio de Ocorrencias', fontSize: 15, bold: true, margin: [0, 4, 0, 2] },
        { text: linhaEscopo.join('  -  '), fontSize: 9, color: '#5e6b65' },
        { text: 'Periodo: ' + periodo + '   -   ' + d.total + ' ocorrencia(s)', fontSize: 9, color: '#5e6b65', margin: [0, 0, 0, 12] },
      ];
      const grupos = {};
      d.ocorrencias.forEach(o => { const key = o.contratoNumero || '-'; (grupos[key] = grupos[key] || []).push(o); });
      const chaves = Object.keys(grupos);
      if (!d.ocorrencias.length) body.push({ text: 'Nenhuma ocorrencia no escopo selecionado.', italics: true, color: '#8a938e' });
      chaves.forEach((key, gi) => {
        if (chaves.length > 1) body.push({ text: 'Contrato ' + key, fontSize: 11, bold: true, color: '#0e7c66', pageBreak: gi > 0 ? 'before' : undefined, margin: [0, gi > 0 ? 0 : 4, 0, 8] });
        let n = 1; grupos[key].forEach(o => body.push(bloco(o, n++)));
      });
      body.push({ canvas: [{ type: 'line', x1: 0, y1: 6, x2: 515, y2: 6, lineWidth: 0.5, lineColor: '#cccccc' }], margin: [0, 8, 0, 0] });
      body.push({ text: [{ text: 'Assinatura digital (HMAC): ', bold: true }, { text: d.assinatura.hash }], fontSize: 7.5, margin: [0, 6, 0, 0] });
      body.push({ text: 'keyId: ' + d.assinatura.keyId + '  -  documento gerado em ' + geradoEm, fontSize: 7.5, color: '#5e6b65' });
      body.push({ text: 'As fotos carregam o rotulo de data/hora e localizacao registrados pelo dispositivo no momento da captura.', fontSize: 7.5, color: '#8a938e', margin: [0, 3, 0, 0] });

      const nomeArq = 'ocorrencias' + (d.escopo.contratoNumero ? '-' + d.escopo.contratoNumero : '') + '.pdf';
      pdfMake.createPdf({
        pageSize: 'A4',
        pageMargins: [40, temBranding ? 96 : 70, 40, 42],
        header, footer, content: body,
        defaultStyle: { fontSize: 10, color: '#12211c' },
      }).download(nomeArq);
    }).catch(e => toast('Nao foi possivel gerar o PDF: ' + e.message, true));
  }

  function abrirEstModal(e) {
    const ed = !!e;
    const coord = (ed && e.lat != null && e.lng != null) ? `${e.lat}, ${e.lng}` : '';
    openModal(`<h2>${ed ? 'Editar' : 'Novo'} estabelecimento</h2>
      <div class="row"><label class="field"><span>Nome</span><input id="eNome" value="${ed ? esc(e.nome) : ''}"></label>
        <label class="field"><span>CNPJ</span><input id="eCnpj" value="${ed ? esc(e.cnpj || '') : ''}"></label></div>
      <label class="field"><span>Endereço</span><input id="eEnd" value="${ed ? esc(e.endereco || '') : ''}"></label>
      <label class="field"><span>Coordenadas (lat, long — padrão Google Maps)</span>
        <input id="eCoord" placeholder="-18.16572, -47.94220" value="${esc(coord)}"></label>
      <p class="muted" style="font-size:.76rem;margin-top:-6px">No Google Maps, clique com o botão direito no ponto e clique nas coordenadas para copiar; cole aqui.</p>
      <div class="actions"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn primary" id="eOk">Salvar</button></div>`);
    $('#eOk').onclick = async () => {
      const nome = $('#eNome').value.trim(); if (!nome) return toast('Informe o nome.', true);
      let lat = null, lng = null;
      const raw = $('#eCoord').value.trim();
      if (raw) {
        const p = raw.replace(/[()]/g, '').split(',').map(s => parseFloat(s.trim()));
        if (p.length !== 2 || isNaN(p[0]) || isNaN(p[1]) || Math.abs(p[0]) > 90 || Math.abs(p[1]) > 180)
          return toast('Coordenadas inválidas. Use: -18.16572, -47.94220', true);
        lat = p[0]; lng = p[1];
      }
      const payload = { nome, cnpj: $('#eCnpj').value.trim(), endereco: $('#eEnd').value.trim(), lat, lng };
      if (ed) payload.id = e.id;
      try { await DB.saveEstabelecimento(payload); closeModal(); toast('Estabelecimento salvo.'); cadEstabelecimentos(); }
      catch (err) { toast(err.message, true); }
    };
  }

  async function renderPac() {
    const cid = getContratoAtual();
    view.innerHTML = `<div class="view-head"><div><div class="eyebrow">Autocontrole</div><h1>P.A.C.</h1>
      <p class="muted" style="font-size:.86rem;margin:.3rem 0 0">Planilhas aplicáveis a este contrato pelos regimes de inspeção. Lançamentos vão para aprovação do gestor.</p></div></div>
      <div id="pacBody" class="muted">Carregando…</div>`;
    if (!cid) return $('#pacBody').innerHTML = `<div class="empty"><strong>Escolha um contrato</strong>Selecione um contrato acima para ver as planilhas.</div>`;
    let data;
    try { data = await DB.getPlanilhasDoContrato(cid); } catch (e) { return $('#pacBody').innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
    if (!data.planilhas.length) {
      return $('#pacBody').innerHTML = `<div class="empty"><strong>Nenhuma planilha aplicável</strong>Defina os regimes de inspeção deste contrato em Cadastro → Contratos (Editar).</div>`;
    }
    const grupos = { produto: [], meio: [], saude: [] };
    data.planilhas.forEach(p => (grupos[p.natureza] || (grupos[p.natureza] = [])).push(p));
    const tipos = {}; data.planilhas.forEach(p => tipos[p.id] = p);
    const secao = (nat, titulo) => (grupos[nat] && grupos[nat].length) ? `
      <div class="eyebrow" style="margin:18px 0 8px">${titulo}</div>
      ${grupos[nat].map(p => `<div class="card" style="display:flex;justify-content:space-between;align-items:center;gap:10px">
        <div><strong>${esc(p.nome)}</strong><div class="muted" style="font-size:.8rem">${esc(p.periodicidade || '')}</div></div>
        <div style="display:flex;gap:8px;flex:none">
          <button class="btn sm" data-hist="${p.id}">Registros</button>
          <button class="btn primary sm" data-novo="${p.id}">Novo registro</button>
        </div></div>`).join('')}` : '';
    $('#pacBody').innerHTML = secao('produto', 'Produto') + secao('meio', 'Meio') + secao('saude', 'Saúde ocupacional');
    $('#pacBody').querySelectorAll('[data-novo]').forEach(b => b.onclick = () => abrirRegistroPac(cid, tipos[b.dataset.novo]));
    $('#pacBody').querySelectorAll('[data-hist]').forEach(b => b.onclick = () => abrirHistoricoPac(cid, tipos[b.dataset.hist]));
  }

  function _campoInput(c) {
    const id = 'f_' + c.key;
    if (c.tipo === 'numero') return `<input id="${id}" type="number" step="any">`;
    if (c.tipo === 'data') return `<input id="${id}" type="date">`;
    if (c.tipo === 'sim_nao') return `<select id="${id}"><option value="">—</option><option>Sim</option><option>Não</option></select>`;
    return `<input id="${id}">`;
  }
  function abrirRegistroPac(cid, tipo) {
    openModal(`<div class="eyebrow">${esc(tipo.periodicidade || '')}</div><h2>${esc(tipo.nome)}</h2>
      ${tipo.campos.map(c => `<label class="field"><span>${esc(c.label)}${c.unidade ? ' (' + esc(c.unidade) + ')' : ''}</span>${_campoInput(c)}</label>`).join('')}
      <label class="field"><span>Fotos (até 3, com data/hora e localização)</span><input type="file" id="pacFotos" accept="image/*" capture="environment" multiple></label>
      <div class="fotos" id="pacPrev"></div>
      <div class="actions"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn primary" id="pacOk">Registrar</button></div>`);
    pedirLocalizacao();
    let fotos = [];
    $('#pacFotos').onchange = async (e) => {
      toast('Processando foto…');
      for (const file of [...e.target.files]) { if (fotos.length >= 3) break; fotos.push(await capturarFoto(file)); }
      $('#pacPrev').innerHTML = fotos.map(f => `<img src="${f.dataUrl}">`).join('');
      if (fotos.some(f => f.lat == null)) toast('Foto sem localização — verifique a permissão de local.', true);
      e.target.value = '';
    };
    $('#pacOk').onclick = async () => {
      const dados = {}; tipo.campos.forEach(c => { const el = document.getElementById('f_' + c.key); if (el) dados[c.key] = el.value; });
      $('#pacOk').disabled = true;
      try { await DB.criarRegistroPac({ contratoId: cid, planilhaTipoId: tipo.id, dados, fotos });
        closeModal(); toast('Registro lançado — aguardando aprovação do gestor.'); }
      catch (e) { toast(e.message, true); $('#pacOk').disabled = false; }
    };
  }
  async function abrirHistoricoPac(cid, tipo) {
    openModal(`<h2>${esc(tipo.nome)}</h2><p class="muted" style="font-size:.82rem;margin:.2rem 0 1rem">${esc(tipo.periodicidade || '')}</p><div id="pacHist" class="muted">Carregando…</div>`);
    const podeDecidir = ['gestor', 'administrador'].includes(papelNoContrato(cid));
    async function load() {
      let regs;
      try { regs = await DB.getRegistrosPac(cid, tipo.id); } catch (e) { return $('#pacHist').innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
      $('#pacHist').innerHTML = regs.length ? regs.map(rg => {
        const chip = rg.estado === 'aprovado' ? '<span class="chip ok">Aprovado</span>'
          : rg.estado === 'reprovado' ? '<span class="chip atraso">Reprovado</span>' : '<span class="chip aberta">Pendente</span>';
        const dados = tipo.campos.map(c => (rg.dados && rg.dados[c.key] != null && rg.dados[c.key] !== '') ? `${esc(c.label)}: <b>${esc(rg.dados[c.key])}</b>` : null).filter(Boolean).join(' · ');
        const fotos = (rg.fotos || []).map(f => `<img src="${f.dataUrl}">`).join('');
        return `<div class="card" style="box-shadow:none;border:1px solid var(--line)">
          <div style="display:flex;justify-content:space-between;align-items:center">${chip}<span class="muted" style="font-size:.76rem">${rg.criadoEm ? new Date(rg.criadoEm).toLocaleString('pt-BR') : ''}</span></div>
          <div style="font-size:.85rem;margin-top:6px">${dados || '<span class="muted">sem dados</span>'}</div>
          <div class="muted" style="font-size:.78rem;margin-top:4px">por ${esc(rg.criadoPorNome || rg.criadoPor || '—')}</div>
          ${fotos ? `<div class="fotos">${fotos}</div>` : ''}
          ${rg.decisao ? `<div class="muted" style="font-size:.78rem;margin-top:4px">${rg.estado === 'aprovado' ? 'Aprovado' : 'Reprovado'} por ${esc(rg.decisao.porNome || rg.decisao.por)}${rg.decisao.observacao ? ' — ' + esc(rg.decisao.observacao) : ''}</div>` : ''}
          ${(podeDecidir && rg.estado === 'pendente') ? `<div style="margin-top:8px;display:flex;gap:8px"><button class="btn primary sm" data-ap="${rg.id}">Aprovar</button><button class="btn danger sm" data-rp="${rg.id}">Reprovar</button></div>` : ''}
        </div>`;
      }).join('') : `<div class="empty"><strong>Nenhum registro</strong>Lance o primeiro em “Novo registro”.</div>`;
      $('#pacHist').querySelectorAll('[data-ap]').forEach(b => b.onclick = async () => {
        try { await DB.decidirRegistroPac(b.dataset.ap, true, ''); toast('Aprovado.'); load(); } catch (e) { toast(e.message, true); }
      });
      $('#pacHist').querySelectorAll('[data-rp]').forEach(b => b.onclick = async () => {
        const obs = prompt('Motivo da reprovação (opcional):') || '';
        try { await DB.decidirRegistroPac(b.dataset.rp, false, obs); toast('Reprovado.'); load(); } catch (e) { toast(e.message, true); }
      });
    }
    load();
  }

  // ══════════════════════════════════════════════════════════════

  function _lerLogo(file) { // reduz para caber no cabeçalho e no limite do servidor
    return new Promise((resolve, reject) => {
      const r = new FileReader();
      r.onload = () => {
        const img = new Image();
        img.onload = () => {
          const maxW = 420, scale = Math.min(1, maxW / img.width);
          const w = Math.round(img.width * scale), h = Math.round(img.height * scale);
          const c = document.createElement('canvas'); c.width = w; c.height = h;
          c.getContext('2d').drawImage(img, 0, 0, w, h);
          resolve(c.toDataURL('image/png'));
        };
        img.onerror = () => reject(new Error('Imagem inválida'));
        img.src = r.result;
      };
      r.onerror = () => reject(new Error('Falha ao ler a imagem'));
      r.readAsDataURL(file);
    });
  }

  async function renderEmpresa() {
    view.innerHTML = `<div class="view-head"><div>
      <div class="eyebrow">SaaS</div><h1>Minha Empresa</h1>
      <p class="muted" style="font-size:.86rem;margin:.3rem 0 0">Estes dados e o logo entram no cabeçalho dos PDFs (relatórios e, futuramente, contratos) dos seus contratos.</p></div></div>
      <div id="empBody" class="muted">Carregando…</div>`;
    let perfil = {};
    try { perfil = await DB.getPerfil() || {}; } catch (e) { return $('#empBody').innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
    let logo = perfil.logoDataUrl || null;
    $('#empBody').innerHTML = `<div class="card">
      <div class="row">
        <label class="field"><span>Razão social</span><input id="pRazao" value="${esc(perfil.razaoSocial || '')}"></label>
        <label class="field"><span>Nome fantasia</span><input id="pFantasia" value="${esc(perfil.nomeFantasia || '')}"></label>
      </div>
      <div class="row">
        <label class="field"><span>CNPJ</span><input id="pCnpj" value="${esc(perfil.cnpj || '')}"></label>
        <label class="field"><span>Contato (telefone / e-mail)</span><input id="pContato" value="${esc(perfil.contato || '')}"></label>
      </div>
      <label class="field"><span>Endereço</span><input id="pEndereco" value="${esc(perfil.endereco || '')}"></label>
      <label class="field"><span>Logo (aparece no cabeçalho do PDF)</span><input type="file" id="pLogo" accept="image/*"></label>
      <div id="logoPrev" style="margin:6px 0 4px">${logo ? `<img src="${logo}" style="max-height:70px;border:1px solid var(--line);border-radius:6px;padding:4px;background:#fff">` : '<span class="muted" style="font-size:.82rem">Sem logo</span>'}</div>
      ${logo ? '<button class="btn ghost sm" id="pRemoveLogo">Remover logo</button>' : ''}
      <div style="margin-top:14px"><button class="btn primary" id="pSalvar">Salvar</button></div>
    </div>`;
    $('#pLogo').onchange = async (e) => {
      if (!e.target.files[0]) return;
      try { logo = await _lerLogo(e.target.files[0]); $('#logoPrev').innerHTML = `<img src="${logo}" style="max-height:70px;border:1px solid var(--line);border-radius:6px;padding:4px;background:#fff">`; }
      catch (err) { toast(err.message, true); }
    };
    const rmBtn = document.getElementById('pRemoveLogo');
    if (rmBtn) rmBtn.onclick = () => { logo = null; $('#logoPrev').innerHTML = '<span class="muted" style="font-size:.82rem">Sem logo</span>'; rmBtn.style.display = 'none'; };
    $('#pSalvar').onclick = async () => {
      $('#pSalvar').disabled = true;
      try {
        await DB.savePerfil({
          razaoSocial: $('#pRazao').value.trim(), nomeFantasia: $('#pFantasia').value.trim(),
          cnpj: $('#pCnpj').value.trim(), contato: $('#pContato').value.trim(),
          endereco: $('#pEndereco').value.trim(), logoDataUrl: logo || null,
        });
        toast('Dados da empresa salvos.');
      } catch (e) { toast(e.message, true); } finally { $('#pSalvar').disabled = false; }
    };
  }

  // ══════════════════════════════════════════════════════════════
  // CLIENTES (SaaS) — só o ADMIN MASTER libera administradores de cliente
  // ══════════════════════════════════════════════════════════════
  async function renderClientes() {
    view.innerHTML = `<div class="view-head">
      <div><div class="eyebrow">Plataforma</div><h1>Clientes</h1>
        <p class="muted" style="font-size:.86rem;margin:.3rem 0 0">Libere o e-mail do administrador de cada cliente. Ele entra com Google e cria os próprios contratos, estabelecimentos e acessos — vendo só o que é dele. Abaixo, a árvore só-leitura de tudo que cada cliente cadastrou.</p></div></div>
      <div class="card">
        <div class="eyebrow">Novo administrador de cliente</div>
        <div class="row" style="margin-top:8px">
          <input id="adEmail" placeholder="e-mail@empresa.com" style="flex:2 1 220px">
          <input id="adOrg" placeholder="Empresa / cliente">
          <input id="adNome" placeholder="Nome (opcional)">
          <button class="btn primary" id="adAdd" style="flex:0 0 auto">Liberar acesso</button>
        </div></div>
      <div id="adLista" style="margin-top:18px"><p class="muted">Carregando…</p></div>`;

    const papelCurto = { administrador: 'Admin', fiscal: 'Fiscal', gestor: 'Gestor', executor: 'Executor' };
    function contratoRow(c) {
      return `<div class="card" style="box-shadow:none;background:var(--surface-2);margin-top:10px">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:10px">
          <div><strong>${esc(c.numero)}</strong> ${c.sim ? '<span class="chip sim">S.I.M.</span>' : ''}
            ${c.objeto ? `<span class="muted" style="font-size:.82rem"> — ${esc(c.objeto)}</span>` : ''}</div>
          <span class="muted" style="font-size:.78rem">${esc(c.estabelecimento || 'sem estabelecimento')}</span>
        </div>
        <div style="margin-top:8px">${c.membros.length
          ? c.membros.map(m => `<span class="chip neutral" style="margin:2px 6px 0 0">${papelCurto[m.papel] || m.papel}: ${esc(m.name || m.email)}</span>`).join('')
          : '<span class="muted" style="font-size:.8rem">sem usuários cadastrados</span>'}</div>
      </div>`;
    }
    function grupoCliente(c) {
      const status = c.jaEntrou ? '<span class="chip ok">Já entrou</span>' : '<span class="chip aberta">Aguardando 1º acesso</span>';
      return `<details class="card" style="padding:0;margin-top:12px">
        <summary style="padding:14px 18px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px">
          <span><strong>${esc(c.org || c.name || c.email)}</strong> ${status}
            <span class="muted" style="font-size:.82rem">· ${c.contratos.length} contrato(s)</span><br>
            <span class="muted" style="font-size:.8rem">${esc(c.email)}</span></span>
          <button class="btn sm danger" data-rm="${esc(c.email)}">Revogar</button>
        </summary>
        <div style="padding:2px 18px 16px">${c.contratos.length ? c.contratos.map(contratoRow).join('') : '<p class="muted" style="font-size:.85rem">Nenhum contrato cadastrado ainda.</p>'}</div>
      </details>`;
    }

    async function listar() {
      let tree;
      try { tree = await DB.getPlatformTree(); } catch (e) { return $('#adLista').innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
      let html = '';
      html += tree.clientes.length ? tree.clientes.map(grupoCliente).join('')
        : `<div class="empty"><strong>Nenhum cliente liberado ainda</strong>Cadastre o e-mail do primeiro administrador de cliente acima.</div>`;
      if (tree.doMaster && tree.doMaster.length) {
        html += `<div class="eyebrow" style="margin:22px 0 2px">Criados por você (master)</div>` + tree.doMaster.map(contratoRow).join('');
      }
      if (tree.orfaos && tree.orfaos.length) {
        html += `<div class="eyebrow" style="margin:22px 0 2px">Contratos sem cliente ativo</div>` + tree.orfaos.map(contratoRow).join('');
      }
      $('#adLista').innerHTML = html;
      $('#adLista').querySelectorAll('[data-rm]').forEach(b => b.onclick = async (ev) => {
        ev.preventDefault(); ev.stopPropagation();
        if (!confirm(`Revogar o acesso de ${b.dataset.rm}? Os contratos que ele criou continuam existindo (passam a aparecer em "sem cliente ativo").`)) return;
        try { await DB.removePlatformAdmin(b.dataset.rm); toast('Acesso revogado.'); listar(); } catch (e) { toast(e.message, true); }
      });
    }
    $('#adAdd').onclick = async () => {
      const email = $('#adEmail').value.trim();
      if (!email.includes('@')) return toast('E-mail inválido.', true);
      try {
        await DB.addPlatformAdmin({ email, org: $('#adOrg').value.trim(), name: $('#adNome').value.trim() });
        $('#adEmail').value = $('#adOrg').value = $('#adNome').value = '';
        toast('Administrador de cliente liberado.'); listar();
      } catch (e) { toast(e.message, true); }
    };
    listar();
  }

  window.closeModal = closeModal;
  </script>

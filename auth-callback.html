<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrando… — QShub</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <div class="mark">QS</div>
      <h1>Entrando…</h1>
      <p class="muted" id="msg" style="margin-top:10px">Validando seu acesso.</p>
      <a class="btn" id="voltar" href="index.html" style="display:none;margin-top:14px">Voltar ao login</a>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="api-client.js"></script>
  <script>
    const msg = document.getElementById('msg');
    function fail(t) { msg.textContent = t; document.getElementById('voltar').style.display = 'inline-flex'; }

    (async () => {
      // Authorization Code + PKCE: o código vem na QUERY STRING (?code=...),
      // não mais no fragmento (#access_token=...) como no fluxo implícito antigo.
      const qs   = new URLSearchParams(location.search);
      const code = qs.get('code');
      const errG = qs.get('error');
      if (errG)  return fail('O Google recusou o login: ' + errG);
      if (!code) return fail('Código do Google não recebido. Tente novamente.');
      try {
        const idToken = await exchangeCodeForIdToken(code);
        await loginWithGoogleToken(idToken);
        location.replace('app.html');
      } catch (e) {
        fail(e.message || 'Não foi possível entrar.');
      }
    })();
  </script>
</body>
</html>
